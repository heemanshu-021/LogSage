[DRAIN]
sim_th = 0.5
depth = 4
max_children = 100
extra_delimiters = []
parametrize_numeric_tokens = True

[MASKING]
masking = [
    {"regex_pattern": "blk_-?\\d+", "mask_with": "ID"},
    {"regex_pattern": "(/|)([0-9]+\\.){3}[0-9]+(:[0-9]+|)", "mask_with": "IP"},
    {"regex_pattern": "\\b0x[a-fA-F0-9]+\\b", "mask_with": "HEX"},
    {"regex_pattern": "\\b[0-9]+\\b", "mask_with": "NUM"}
  ]
mask_prefix = <
mask_suffix = >

[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[PROFILING]
enabled = False
report_sec = 60
