limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=analysis_limit:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 27m;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:8000/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Keep the canonical login endpoint's limit on the slash variant too.
    # Proxy directly to the canonical route so FastAPI cannot redirect a POST
    # into a less restrictive general API location.
    location = /api/auth/login/ {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:8000/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/logs/analyze {
        limit_req zone=analysis_limit burst=2 nodelay;
        proxy_pass http://backend:8000/api/logs/analyze;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"Too Many Requests","detail":"Rate limit exceeded. Retry later.","status_code":429}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
